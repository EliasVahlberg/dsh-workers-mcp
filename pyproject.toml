[project]
name = "dsh-workers-mcp"
dynamic = ["version"]      # the version is `__version__` in src/dsh_workers_mcp/__init__.py
description = "MCP server for driving long-lived DeepSeek Harness (dsh) agent sessions as persistent workers: dispatch, unblock, inspect, and steer them from an orchestrating agent."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Elias Vahlberg" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "deepseek-harness",
    "dsh",
    "agent-orchestration",
    "multi-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

# Deliberately empty. The runtime is stdlib-only -- including a hand-rolled
# WebSocket reader -- so this can be dropped beside any agent harness without
# pulling in a dependency tree. Do not add a runtime dependency without a
# reason that outweighs that.
dependencies = []

[project.scripts]
dsh-workers-mcp = "dsh_workers_mcp.server:main"
dshctl = "dsh_workers_mcp.dshctl:main"
dsh-wake = "dsh_workers_mcp.wake:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "radon>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/dsh_workers_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_workers_mcp"]

# overlays/ sits at the repository root so it can be found; the wheel carries it
# inside the package, where dshctl looks first.
[tool.hatch.build.targets.wheel.force-include]
"overlays" = "dsh_workers_mcp/overlays"
